[project]
name = "ragcanon"
version = "0.1.0"
description = "Checks new writing against a self-contradicting corpus and resolves conflicts by configurable source authority."
requires-python = ">=3.12"
dependencies = [
    "sentence-transformers>=3.0",
    "numpy>=2.0",
    "anthropic>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ragcanon"]
